# BARBERAPP API — VirtualHost de referencia para VPS (Apache 2.4 + PHP-FPM).
# El despliegue completo (SSL, cron, workers, backups) se documenta en la Fase 15.
<VirtualHost *:80>
    ServerName api.barberapp.pe
    Redirect permanent / https://api.barberapp.pe/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.barberapp.pe
    DocumentRoot /var/www/barberapp/backend/public

    <Directory /var/www/barberapp/backend/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/api.barberapp.pe/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.barberapp.pe/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/barberapp-api-error.log
    CustomLog ${APACHE_LOG_DIR}/barberapp-api-access.log combined
</VirtualHost>
