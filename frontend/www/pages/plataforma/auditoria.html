<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <link rel="stylesheet" href="../../css/plataforma.css">
  <meta name="referrer" content="no-referrer">
  <title>Auditoría · Plataforma BARBERAPP</title>
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="../auth/cuenta.html" aria-label="Volver a mi cuenta" data-icon="back"></a>
    <h1 class="topbar__title">Auditoría <span class="muted" data-role-name></span></h1>
    <span class="pl-topbar-tag">Plataforma</span>
  </header>
  <div class="wrap"><nav class="panel-nav" data-panel-nav aria-label="Módulos de la plataforma"></nav></div>
  <main class="wrap panel-page" aria-busy="true" data-page>
    <p class="alert" data-notice role="status" hidden></p>

    <div class="panel-head">
      <div><h2>Auditoría</h2><p>Registro de solo lectura de las acciones importantes: inicios de sesión, cambios de estado, pagos, accesos denegados y consultas del equipo.</p></div>
    </div>
    <form class="filters" data-filters role="search">
      <div class="field"><label for="f-accion">Acción</label><select id="f-accion" name="accion"><option value="">Todas</option></select></div>
      <div class="field"><label for="f-resultado">Resultado</label><select id="f-resultado" name="resultado"><option value="">Todos</option><option value="exito">Éxito</option><option value="denegado">Denegado</option><option value="error">Error</option></select></div>
      <div class="field"><label for="f-tenant">Barbería (slug)</label><input id="f-tenant" name="tenant" autocomplete="off" placeholder="demo-centro"></div>
      <div class="field"><label for="f-usuario">Cuenta (correo)</label><input id="f-usuario" name="usuario" type="email" autocomplete="off"></div>
      <div class="field"><label for="f-desde">Desde</label><input id="f-desde" name="desde" type="date"></div>
      <div class="field"><label for="f-hasta">Hasta</label><input id="f-hasta" name="hasta" type="date"></div>
    </form>
    <div data-loading><div class="skeleton"></div></div>
    <ul class="rows" data-list></ul>
    <button class="btn btn--ghost" type="button" data-more hidden>Ver más</button>
  </main>

  <dialog class="sheet" data-detail aria-labelledby="det-title">
    <div class="sheet__head"><h2 id="det-title" data-det-title>Evento</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar" data-icon="close"></button></div>
    <div class="sheet__body" data-det-body></div>
  </dialog>
  <script type="module" src="../../js/pages/plataforma-auditoria.js"></script>
</body>
</html>
