<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <link rel="stylesheet" href="../../css/plataforma.css">
  <meta name="referrer" content="no-referrer">
  <title>Configuración · Plataforma BARBERAPP</title>
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="../auth/cuenta.html" aria-label="Volver a mi cuenta" data-icon="back"></a>
    <h1 class="topbar__title">Configuración <span class="muted" data-role-name></span></h1>
    <span class="pl-topbar-tag">Plataforma</span>
  </header>
  <div class="wrap"><nav class="panel-nav" data-panel-nav aria-label="Módulos de la plataforma"></nav></div>
  <main class="wrap panel-page" aria-busy="true" data-page>
    <p class="alert" data-notice role="status" hidden></p>

    <div class="panel-head">
      <div><h2>Configuración de la plataforma</h2><p>Parámetros globales de BARBERAPP y reglas de avisos por defecto para las barberías.</p></div>
    </div>
    <div data-loading><div class="skeleton"></div></div>
    <form class="form" data-form novalidate hidden>
      <p class="alert" data-form-alert role="alert" hidden></p>
      <section class="card-box" aria-labelledby="h-par"><h3 id="h-par">Parámetros generales</h3><div class="form" data-params></div></section>
      <section class="card-box" aria-labelledby="h-av"><h3 id="h-av">Avisos por defecto</h3>
        <p class="hint" data-av-hint></p><div class="form" data-avisos></div></section>
      <div class="toolbar"><button class="btn" type="submit" data-loading="Guardando…">Guardar cambios</button></div>
    </form>
  </main>

  <script type="module" src="../../js/pages/plataforma-configuracion.js"></script>
</body>
</html>
