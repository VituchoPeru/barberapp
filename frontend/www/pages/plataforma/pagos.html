<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <link rel="stylesheet" href="../../css/plataforma.css">
  <meta name="referrer" content="no-referrer">
  <title>Pagos · Plataforma BARBERAPP</title>
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="../auth/cuenta.html" aria-label="Volver a mi cuenta" data-icon="back"></a>
    <h1 class="topbar__title">Pagos <span class="muted" data-role-name></span></h1>
    <span class="pl-topbar-tag">Plataforma</span>
  </header>
  <div class="wrap"><nav class="panel-nav" data-panel-nav aria-label="Módulos de la plataforma"></nav></div>
  <main class="wrap panel-page" aria-busy="true" data-page>
    <p class="alert" data-notice role="status" hidden></p>

    <div class="panel-head">
      <div><h2>Pagos</h2><p>Cobros de suscripciones registrados por el equipo. Los pagos se registran desde la ficha de cada suscripción.</p></div>
    </div>
    <form class="filters" data-filters role="search">
      <div class="field field--grow"><label for="f-q">Buscar</label><input id="f-q" name="q" type="search" autocomplete="off" placeholder="Barbería o n.º de operación"></div>
      <div class="field"><label for="f-estado">Estado</label><select id="f-estado" name="estado"><option value="">Todos</option><option value="pendiente">Por confirmar</option><option value="confirmado">Confirmado</option><option value="rechazado">Rechazado</option><option value="reembolsado">Reembolsado</option></select></div>
      <div class="field"><label for="f-metodo">Método</label><select id="f-metodo" name="metodo"><option value="">Todos</option></select></div>
      <div class="field"><label for="f-desde">Desde</label><input id="f-desde" name="desde" type="date"></div>
      <div class="field"><label for="f-hasta">Hasta</label><input id="f-hasta" name="hasta" type="date"></div>
    </form>
    <div class="kpis" data-totals></div>
    <p class="muted" data-count aria-live="polite"></p>
    <div data-loading><div class="skeleton"></div></div>
    <ul class="rows" data-list></ul>
    <div class="pager" data-pager hidden></div>
  </main>

  <script type="module" src="../../js/pages/plataforma-pagos.js"></script>
</body>
</html>
