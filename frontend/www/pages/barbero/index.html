<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BARBERAPP">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <link rel="stylesheet" href="../../css/barbero.css">
  <meta name="referrer" content="no-referrer">
  <title>Hoy · Mi agenda BARBERAPP</title>
</head>
<body class="app bb">
  <header class="topbar">
    <a class="icon-btn" href="../auth/cuenta.html" aria-label="Volver a mi cuenta" data-icon="back"></a>
    <h1 class="topbar__title">Mi agenda <span class="muted bb-tenant" data-tenant-name></span></h1>
    <a class="btn btn--ghost btn--sm" data-full-panel hidden href="../panel/inicio.html">Panel</a>
  </header>
  <main class="wrap bb-page" aria-busy="true" data-page>
    <p class="alert" data-notice role="status" hidden></p>
    <div class="bb-day">
      <div>
        <p class="bb-hello" data-hello></p>
        <h2 class="bb-date" data-date-title>Hoy</h2>
      </div>
      <div class="bb-daynav">
        <button class="icon-btn" type="button" data-prev aria-label="Día anterior"><span class="icon--flip" data-icon="chevron"></span></button>
        <button class="btn btn--ghost btn--sm" type="button" data-today>Hoy</button>
        <button class="icon-btn" type="button" data-next aria-label="Día siguiente"><span data-icon="chevron"></span></button>
        <label class="sr-only" for="f-fecha">Elegir fecha</label><input class="bb-datepick" id="f-fecha" type="date" data-fecha>
      </div>
    </div>
    <div class="bb-stats" data-stats></div>
    <a class="callout" data-pending href="ausencias.html" hidden><span data-icon="bell"></span><span data-pending-text></span></a>
    <section class="bb-focus" data-focus hidden aria-live="polite"></section>
    <div data-loading><div class="skeleton" style="height:140px"></div><div class="skeleton" style="height:260px;margin-top:12px"></div></div>
    <section aria-labelledby="h-dia" data-day-section hidden>
      <div class="bb-sechead"><h3 id="h-dia" class="group-title">Agenda del día</h3><span class="bb-updated" data-updated aria-live="polite"></span>
        <button class="icon-btn" type="button" data-refresh aria-label="Actualizar"><span data-icon="refresh"></span></button></div>
      <ol class="bb-timeline" data-timeline></ol>
    </section>
  </main>
  <dialog class="sheet" data-detail aria-labelledby="det-title">
    <div class="sheet__head"><h2 id="det-title" data-det-title>Cita</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar" data-icon="close"></button></div>
    <div class="sheet__body" data-det-body></div>
  </dialog>
  <script type="module" src="../../js/pages/barbero-hoy.js"></script>
  <script type="module" src="../../js/shell.js"></script>
</body>
</html>
