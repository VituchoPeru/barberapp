<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BARBERAPP">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <link rel="stylesheet" href="../../css/barbero.css">
  <meta name="referrer" content="no-referrer">
  <title>Ausencias · Mi agenda BARBERAPP</title>
</head>
<body class="app bb">
  <header class="topbar">
    <a class="icon-btn" href="../auth/cuenta.html" aria-label="Volver a mi cuenta" data-icon="back"></a>
    <h1 class="topbar__title">Ausencias <span class="muted bb-tenant" data-tenant-name></span></h1>
    <a class="btn btn--ghost btn--sm" data-full-panel hidden href="../panel/inicio.html">Panel</a>
  </header>
  <main class="wrap bb-page" aria-busy="true" data-page>
    <p class="alert" data-notice role="status" hidden></p>
    <div class="panel-head"><div><h2>Ausencias y bloqueos</h2><p data-rule></p></div>
      <button class="btn btn--sm" type="button" data-new hidden><span data-icon="plus"></span> Solicitar</button></div>
    <div data-loading><div class="skeleton"></div><div class="skeleton" style="margin-top:12px"></div></div>
    <section data-sec="solicitado" hidden><h3 class="group-title">Esperando respuesta</h3><ul class="rows" data-list="solicitado"></ul></section>
    <section data-sec="aprobado" hidden><h3 class="group-title">Aprobadas</h3><ul class="rows" data-list="aprobado"></ul></section>
    <section data-sec="general" hidden><h3 class="group-title">Feriados y cierres de la barbería</h3><ul class="rows" data-list="general"></ul></section>
    <section data-sec="rechazado" hidden><h3 class="group-title">No aprobadas</h3><ul class="rows" data-list="rechazado"></ul></section>
    <div data-empty hidden></div>
  </main>

  <dialog class="sheet" data-sheet aria-labelledby="req-title">
    <form class="form" data-form novalidate>
      <div class="sheet__head"><h2 id="req-title">Solicitar ausencia</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar" data-icon="close"></button></div>
      <div class="sheet__body">
        <p class="alert" data-form-alert role="alert" hidden></p>
        <p class="alert" data-type="info" data-approval-hint></p>
        <div class="field"><label for="r-tipo">Tipo</label>
          <select id="r-tipo" name="tipo"><option value="vacaciones">Vacaciones</option><option value="ausencia">Ausencia (trámite, salud…)</option><option value="descanso">Descanso puntual</option><option value="bloqueo">Bloquear un horario</option></select>
          <p class="field__error" data-error-for="tipo"></p></div>
        <label class="switch"><span><strong>Todo el día</strong><br><small class="muted">Desactívalo para indicar horas.</small></span><input type="checkbox" role="switch" name="dia_completo" checked></label>
        <div class="row2" data-days>
          <div class="field"><label for="r-fi">Desde</label><input id="r-fi" type="date" name="fecha_inicio"><p class="field__error" data-error-for="fecha_inicio"></p></div>
          <div class="field"><label for="r-ff">Hasta (incluido)</label><input id="r-ff" type="date" name="fecha_fin"><p class="field__error" data-error-for="fecha_fin"></p></div>
        </div>
        <div class="row2" data-hours hidden>
          <div class="field"><label for="r-ini">Inicio</label><input id="r-ini" type="datetime-local" name="inicio" step="300"><p class="field__error" data-error-for="inicio"></p></div>
          <div class="field"><label for="r-fin">Fin</label><input id="r-fin" type="datetime-local" name="fin" step="300"><p class="field__error" data-error-for="fin"></p></div>
        </div>
        <div class="field" data-branch-field hidden><label for="r-suc">Sede</label><select id="r-suc" name="sucursal_id"><option value="">Todas mis sedes</option></select><p class="field__error" data-error-for="sucursal_id"></p></div>
        <div class="field"><label for="r-motivo">Motivo <span data-motivo-req>(obligatorio)</span></label><textarea id="r-motivo" name="motivo" maxlength="255" rows="2" placeholder="Ej.: viaje familiar, cita médica"></textarea><p class="field__error" data-error-for="motivo"></p></div>
      </div>
      <div class="sheet__foot"><button class="btn btn--ghost" type="button" data-close>Cancelar</button><button class="btn" type="submit" data-loading="Enviando…" data-submit>Enviar solicitud</button></div>
    </form>
  </dialog>
  <script type="module" src="../../js/pages/barbero-ausencias.js"></script>
  <script type="module" src="../../js/shell.js"></script>
</body>
</html>
