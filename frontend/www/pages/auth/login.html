<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BARBERAPP">
  <meta name="referrer" content="no-referrer">
  <title>Iniciar sesión · BARBERAPP</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="auth__card">
      <a class="auth__brand" href="../../index.html" aria-label="BARBERAPP, inicio">
        <span class="brand">BARBER<span>APP</span></span>
        <span class="tagline">Tu estilo, tu momento</span>
      </a>
      <h1>Iniciar sesión</h1>
      <form class="form" id="login-form" novalidate>
        <p class="alert" data-form-alert role="alert" hidden></p>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
          <p class="field__error" data-error-for="email"></p>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" data-toggle-password aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
          <p class="field__error" data-error-for="password"></p>
        </div>
        <button class="btn btn--block" type="submit" data-loading="Ingresando…">Ingresar</button>
        <div class="links">
          <a href="olvide.html">¿Olvidaste tu contraseña?</a>
          <a href="registro.html">Crear cuenta</a>
        </div>
      </form>
    </div>
  </main>
  <script type="module" src="../../js/pages/login.js"></script>
  <script type="module" src="../../js/shell.js"></script>
</body>
</html>
