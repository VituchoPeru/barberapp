<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="referrer" content="no-referrer">
  <title>Nueva contraseña · BARBERAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="auth__card">
      <a class="auth__brand" href="../../index.html" aria-label="BARBERAPP, inicio">
        <span class="brand">BARBER<span>APP</span></span>
        <span class="tagline">Tu estilo, tu momento</span>
      </a>
      <h1 data-title>Crea una nueva contraseña</h1>
      <form class="form" id="restablecer-form" novalidate>
        <p class="alert" data-form-alert role="alert" hidden></p>
        <div class="field">
          <label for="password">Nueva contraseña</label>
          <div class="password">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-hint">
            <button type="button" data-toggle-password aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
          <p class="hint" id="password-hint">Mínimo 8 caracteres, con letras y números.</p>
          <p class="field__error" data-error-for="password"></p>
        </div>
        <div class="field">
          <label for="password2">Repite la contraseña</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" required>
          <p class="field__error" data-error-for="password2"></p>
        </div>
        <button class="btn btn--block" type="submit" data-loading="Guardando…">Guardar contraseña</button>
      </form>
    </div>
  </main>
  <script type="module" src="../../js/pages/restablecer.js"></script>
</body>
</html>
