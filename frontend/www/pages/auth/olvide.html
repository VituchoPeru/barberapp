<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar contraseña · BARBERAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="auth__card">
      <a class="auth__brand" href="../../index.html" aria-label="BARBERAPP, inicio">
        <span class="brand">BARBER<span>APP</span></span>
        <span class="tagline">Tu estilo, tu momento</span>
      </a>
      <h1>Recuperar contraseña</h1>
      <p class="auth__lead">Te enviaremos un enlace a tu correo para crear una nueva contraseña.</p>
      <form class="form" id="olvide-form" novalidate>
        <p class="alert" data-form-alert role="alert" hidden></p>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
          <p class="field__error" data-error-for="email"></p>
        </div>
        <button class="btn btn--block" type="submit" data-loading="Enviando…">Enviar enlace</button>
        <p class="center"><a href="login.html">Volver a iniciar sesión</a></p>
      </form>
    </div>
  </main>
  <script type="module" src="../../js/pages/olvide.js"></script>
</body>
</html>
