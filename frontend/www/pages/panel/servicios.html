<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BARBERAPP">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <meta name="referrer" content="no-referrer">
  <title>Servicios · Panel BARBERAPP</title>
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="../auth/cuenta.html" aria-label="Volver a mi cuenta" data-icon="back"></a>
    <h1 class="topbar__title">Servicios <span class="muted" data-tenant-name></span></h1>
  </header>
  <div class="wrap"><nav class="panel-nav" data-panel-nav aria-label="Módulos del panel"></nav></div>
  <main class="wrap panel-page" aria-busy="true" data-page>
    <p class="alert" data-notice role="status" hidden></p>
    <div class="panel-head">
      <div><h2>Servicios y precios</h2><p>Lo que ofreces, cuánto dura y cuánto cuesta. Los inactivos no se muestran a los clientes.</p></div>
      <div class="toolbar">
        <button class="btn btn--ghost btn--sm" type="button" data-categories>Categorías</button>
        <button class="btn btn--sm" type="button" data-new>Nuevo servicio</button>
      </div>
    </div>
    <div data-loading><div class="skeleton"></div><div class="skeleton" style="margin-top:8px"></div></div>
    <div data-list></div>
  </main>

  <dialog class="sheet" data-sheet aria-labelledby="svc-title">
    <form class="form" data-form novalidate>
      <div class="sheet__head"><h2 id="svc-title" data-sheet-title>Nuevo servicio</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar" data-icon="close"></button></div>
      <div class="sheet__body">
        <p class="alert" data-form-alert role="alert" hidden></p>
        <div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre" maxlength="120" required placeholder="Ej.: Corte y barba"><p class="field__error" data-error-for="nombre"></p></div>
        <div class="row2">
          <div class="field"><label for="duracion_minutos">Duración (minutos)</label><input id="duracion_minutos" name="duracion_minutos" type="number" inputmode="numeric" min="5" max="600" step="5" required placeholder="30"><p class="field__error" data-error-for="duracion_minutos"></p></div>
          <div class="field"><label for="precio">Precio (S/)</label><input id="precio" name="precio" type="number" inputmode="decimal" min="0" max="99999.99" step="0.10" required placeholder="25.00"><p class="field__error" data-error-for="precio"></p></div>
        </div>
        <div class="row2">
          <div class="field"><label for="categoria_id">Categoría</label><select id="categoria_id" name="categoria_id"></select><p class="field__error" data-error-for="categoria_id"></p></div>
          <div class="field"><label for="tipo">Tipo (filtro del marketplace)</label><select id="tipo" name="tipo"></select><p class="field__error" data-error-for="tipo"></p></div>
        </div>
        <div class="field"><label for="descripcion">Descripción (opcional)</label><textarea id="descripcion" name="descripcion" maxlength="1000" placeholder="Qué incluye el servicio"></textarea><p class="field__error" data-error-for="descripcion"></p></div>
        <label class="switch"><span><strong>Activo</strong><br><small class="muted">Visible para reservar en tu perfil y el marketplace.</small></span><input type="checkbox" role="switch" name="activo" checked></label>
        <button class="btn btn--danger btn--sm" type="button" data-delete hidden>Eliminar servicio</button>
      </div>
      <div class="sheet__foot"><button class="btn btn--ghost" type="button" data-close>Cancelar</button><button class="btn" type="submit" data-loading="Guardando…">Guardar</button></div>
    </form>
  </dialog>

  <dialog class="sheet" data-cat-sheet aria-labelledby="cat-title">
    <div class="sheet__head"><h2 id="cat-title">Categorías</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar" data-icon="close"></button></div>
    <div class="sheet__body">
      <p class="hint">Agrupan tus servicios en tu perfil (por ejemplo: Cortes, Barba, Tratamientos).</p>
      <ul class="rows" data-cat-list></ul>
      <form class="form" data-cat-form novalidate>
        <p class="alert" data-form-alert role="alert" hidden></p>
        <div class="field"><label for="cat-nombre">Nueva categoría</label><input id="cat-nombre" name="nombre" maxlength="80" placeholder="Ej.: Tratamientos"><p class="field__error" data-error-for="nombre"></p></div>
        <button class="btn btn--sm" type="submit" data-loading="Agregando…">Agregar</button>
      </form>
    </div>
  </dialog>
  <script type="module" src="../../js/pages/panel-servicios.js"></script>
  <script type="module" src="../../js/shell.js"></script>
</body>
</html>
