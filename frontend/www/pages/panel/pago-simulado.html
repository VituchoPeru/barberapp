<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Simulador de pago · BARBERAPP</title>
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="suscripcion.html" aria-label="Volver a la suscripción" data-icon="back" data-back></a>
    <h1 class="topbar__title">Simulador de pago</h1>
  </header>
  <main class="wrap panel-page" aria-busy="true" data-page>
    <div class="sim-box">
      <p class="alert" data-type="info">Entorno de pruebas: este simulador reemplaza a la pasarela y <strong>no cobra dinero real</strong>. En producción se usa Mercado Pago.</p>
      <p class="alert" data-notice role="status" hidden></p>
      <section class="card-box" aria-labelledby="h-orden" data-order hidden>
        <h3 id="h-orden">Orden de pago</h3>
        <dl class="kv" data-detail></dl>
        <div class="toolbar" style="margin-top:16px" data-actions>
          <button class="btn" type="button" data-sim="1" data-loading="Procesando…">Aprobar pago</button>
          <button class="btn btn--ghost" type="button" data-sim="0" data-loading="Procesando…">Rechazar pago</button>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="../../js/pages/panel-pago-simulado.js"></script>
</body>
</html>
