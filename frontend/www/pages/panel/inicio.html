<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/panel.css">
  <meta name="referrer" content="no-referrer">
  <title>Inicio · Panel BARBERAPP</title>
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="../auth/cuenta.html" aria-label="Volver a mi cuenta" data-icon="back"></a>
    <h1 class="topbar__title">Inicio <span class="muted" data-tenant-name></span></h1>
  </header>
  <div class="wrap"><nav class="panel-nav" data-panel-nav aria-label="Módulos del panel"></nav></div>
  <main class="wrap panel-page" aria-busy="true" data-page>
    <p class="alert" data-notice role="status" hidden></p>
    <div class="panel-head">
      <div><h2 data-hello>Resumen del día</h2><p data-date-label>Hoy en tu barbería</p></div>
      <div class="toolbar">
        <div class="field"><label for="f-sucursal">Sucursal</label><select id="f-sucursal" data-sucursal><option value="">Todas</option></select></div>
        <a class="btn btn--sm" data-link-agenda href="agenda.html">Abrir agenda</a>
      </div>
    </div>
    <div data-loading><div class="skeleton"></div><div class="skeleton" style="margin-top:8px"></div></div>
    <div class="callouts" data-callouts></div>
    <section aria-labelledby="h-hoy"><h3 class="group-title" id="h-hoy">Citas de hoy</h3><div class="kpis" data-kpis></div></section>
    <div class="grid-2">
      <section class="card-box" aria-labelledby="h-prox"><h3 id="h-prox">Próximas citas</h3><ul class="rows" data-next></ul></section>
      <section class="card-box" aria-labelledby="h-ocup"><h3 id="h-ocup">Ocupación de barberos hoy</h3>
        <p class="hint">Minutos reservados sobre la jornada disponible de cada barbero.</p><ul class="hbars" data-occupancy></ul></section>
    </div>
    <section class="card-box" aria-labelledby="h-semana"><h3 id="h-semana">Citas de los próximos 7 días</h3><div data-week></div></section>
  </main>
  <script type="module" src="../../js/pages/panel-inicio.js"></script>
</body>
</html>
