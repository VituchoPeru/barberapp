<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <title>Sin conexión · BARBERAPP</title>
  <!-- El service worker muestra esta página en lugar de una pantalla que aún no se guardó.
       Se sirve con la URL de la página pedida, así que no usa archivos externos. -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 16px; padding: 24px 16px;
      background: #111111; color: #FFFFFF; text-align: center; line-height: 1.5;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    svg { width: 88px; height: 88px; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.5rem; }
    p { margin: 0 auto; max-width: 34ch; color: #B8B8BC; }
    button { margin: 8px auto 0; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #C9A45C;
      color: #111111; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid #E4C88A; outline-offset: 3px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4C88A"/><stop offset="1" stop-color="#A9843F"/></linearGradient></defs>
    <path fill="url(#g)" d="M22 48 34 28l14 18 12-24 12 24 14-18 12 20-8 26H30z"/>
    <circle cx="34" cy="26" r="5" fill="url(#g)"/><circle cx="60" cy="18" r="6" fill="url(#g)"/><circle cx="86" cy="26" r="5" fill="url(#g)"/>
    <rect x="30" y="78" width="60" height="9" rx="3" fill="url(#g)"/>
    <path fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" d="M44 98c6 8 26 8 32 0M60 92v20"/>
  </svg>
  <h1>Sin conexión</h1>
  <p>Esta pantalla necesita internet. Revisa tu conexión y vuelve a intentarlo. Tus reservas no se modifican sin conexión.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</body>
</html>
